name: torch-lightning
channels:
  - pytorch
  - nvidia
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytorch-cuda=11.8
  - pytorch==2.3.1
  - torchvision==0.18.1
  - pip:
    - lightning
    - scikit-image
    - scipy
    - einops 
    - Pillow
    - pandas
    - opencv-python
    - timm
    - matplotlib
    - wandb
    - natsort
    - tensorboard
    - omegaconf
    - rich
    - lpips
    - ml_collections
    - clean-fid
    - piq