dataset: 
  target: png.datasets.polyu.PolyUDataset
  params:
    dataroot: <PATH_TO_DATASET> # Root directory of the dataset.

    patch_size: 256 # Spatial crop size (square patches: patch_size x patch_size).

    preload: False # If True, preload all images into RAM at initialization.
    parallel_preload: False # If True and preload=True, use multiprocessing for faster preload.
    test: True # Set True to disable training-only randomizations.
    augmentation: False # Apply on-the-fly geometric augmentations.

data_loader: 
  batch_size: 1 # Number of samples per batch.
  shuffle: false # If True, shuffle the data at every epoch.
  num_workers: 2 # Number of subprocesses to use for data loading.
  drop_last: false # If True, drop the last incomplete batch.

batch_transform: 
  target: png.datasets.batch_transform.IdentityBatchTransform
